name: Setup Template

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  init-template:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set NEXT_PUBLIC_APP_NAME in .env.example and package.json
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e '
            const fs = require("fs");
            const repoName = process.env.REPO_NAME || "my-app";
            const appTitle = repoName
              .replace(/[-_]+/g, " ")
              .replace(/\b\w/g, (c) => c.toUpperCase());

            if (fs.existsSync(".env.example")) {
              let envExample = fs.readFileSync(".env.example", "utf8");
              if (/^NEXT_PUBLIC_APP_NAME=.*$/m.test(envExample)) {
                envExample = envExample.replace(
                  /^NEXT_PUBLIC_APP_NAME=.*$/m,
                  `NEXT_PUBLIC_APP_NAME="${appTitle}"`
                );
              } else {
                envExample = `NEXT_PUBLIC_APP_NAME="${appTitle}"\n` + envExample;
              }
              fs.writeFileSync(".env.example", envExample);
            }

            if (fs.existsSync("package.json")) {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.name = repoName.toLowerCase();
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
          '

      - name: Remove setup workflow after first run
        run: rm -f .github/workflows/setup-template.yml

      - name: Commit and push template initialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: initialize template app name"
            git push
          fi
